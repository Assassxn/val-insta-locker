<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vgrad" x1="256" y1="120" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset="0.55" stop-color="#ff4655"/>
      <stop offset="1" stop-color="#c92a38"/>
    </linearGradient>
    <linearGradient id="bggrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16161c"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
  </defs>

  <!-- Backplate with Valorant-style cut corners (top-right / bottom-left) -->
  <path d="M32 32 H428 L480 84 V480 H84 L32 428 Z" fill="url(#bggrad)"/>
  <path d="M32 32 H428 L480 84 V480 H84 L32 428 Z" stroke="#26262e" stroke-width="4"/>

  <!-- HUD corner brackets -->
  <path d="M72 112 V72 H112" stroke="#ff4655" stroke-width="10" opacity="0.85"/>
  <path d="M440 400 V440 H400" stroke="#ff4655" stroke-width="10" opacity="0.85"/>

  <!-- V chevron -->
  <path d="M120 132 H196 L256 280 L316 132 H392 L286 380 H226 Z" fill="url(#vgrad)"/>

  <!-- Crosshair diamond above the V -->
  <rect x="236" y="112" width="40" height="40" transform="rotate(45 256 132)" fill="#ece9e4"/>
</svg>
